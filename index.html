<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reflexos">
<meta name="theme-color" content="#1b2030">
<title>Reflexos</title>
<style>
:root{--bg:#f2f3f7;--card:#fff;--ink:#1b2030;--mute:#6b7285;--line:#d9dce5;--acc:#2f6bff;--accink:#fff;--danger:#d93c3c}
@media(prefers-color-scheme:dark){:root{--bg:#161a26;--card:#20263a;--ink:#eef0f6;--mute:#9aa2b8;--line:#323a54;--acc:#6c94ff;--accink:#0d1330;--danger:#ff7a7a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);touch-action:manipulation;display:flex;justify-content:center}
[hidden]{display:none!important}
main{width:100%;max-width:640px;height:100%;padding:16px;display:flex;flex-direction:column;overflow:hidden}
#home{justify-content:space-between}
#list{flex:1;overflow-y:auto;overflow-x:hidden;margin:4px -4px;padding:0 4px;-webkit-overflow-scrolling:touch}
#prep{justify-content:center}
#edit{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:block}
h1{font-size:28px;margin:4px 0 12px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
button.bad{color:var(--danger)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px}
input[type=color]{padding:2px;width:56px;flex:none}
input[type=checkbox]{width:24px;min-height:24px;flex:none}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
label.chk{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--ink);margin:12px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>button,.row>input[type=color]{flex:none}
.seg{display:flex;gap:4px;background:var(--card);border-radius:16px;padding:4px;margin-bottom:8px;flex:none}
.seg button{flex:1;border:0;background:transparent;min-height:48px;font-size:18px}
.seg button.on{background:var(--acc);color:var(--accink);font-weight:700}
#desc{margin:0 0 10px;flex:none}
.ex{display:flex;gap:10px;margin-bottom:12px}
.ex .open{flex:1;min-height:84px;border-radius:20px;padding:14px 18px;text-align:left;font-size:20px;font-weight:700;display:flex;flex-direction:column;justify-content:center;gap:2px}
.ex .open small{font-size:14px;font-weight:400;color:var(--mute)}
.ex .ed{width:84px;min-height:84px;border-radius:20px;padding:0;flex:none}
.home-bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;flex:none}
.home-bar button{min-height:52px;font-size:17px}
.home-bar .pri{flex:1 1 100%;min-height:60px;font-size:19px}
.home-bar button:not(.pri){flex:1}
.step{background:var(--card);border-left:8px solid #e53935;border-radius:12px;padding:12px;margin:12px 0}
.step-tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin-bottom:8px}
.tools{display:flex;gap:6px;margin-left:auto}
.tools button{padding:6px 10px;min-height:40px}
.muted{color:var(--mute)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.sum{background:var(--card);border-radius:18px;padding:4px 18px;width:100%}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}
.prepbar{display:flex;flex-direction:column;gap:14px;margin-top:24px;width:100%}
.prepbar .go{min-height:96px;font-size:28px;border-radius:24px}
.prepbar .back{min-height:52px;width:60%;align-self:center;font-size:17px}
#run{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:hidden}
#box{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none}
#txt{white-space:pre;text-align:center;line-height:1.1;font-weight:800;display:inline-block}
#x{position:absolute;z-index:15;top:max(10px,env(safe-area-inset-top));left:10px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:22px;width:44px;padding:0}
#res{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#res .inner{width:100%;max-width:600px}
#res .bar{justify-content:center;margin-top:24px}
#res .bar button{flex:1;min-height:56px;font-size:18px;pointer-events:auto}
.big{font-size:56px;font-weight:800}
</style>
</head>
<body>
<main id="home">
  <h1>Reflexos</h1>
  <div class="seg" id="tabs"></div>
  <p class="muted" id="desc"></p>
  <div id="list"></div>
  <div class="home-bar">
    <button class="pri" data-a="new">Novo exercício</button>
    <button data-a="imp">Importar</button>
    <button data-a="exp">Copiar backup</button>
  </div>
</main>

<main id="prep" hidden></main>

<main id="edit" hidden></main>

<div id="run" hidden>
  <button id="x" aria-label="Sair">✕</button>
  <div id="box"><div id="txt"></div></div>
</div>

<div id="res" hidden></div>

<script>
const $=s=>document.querySelector(s);
const KEY='reflexos.v2';
const BLINK_BG='#1b2030';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const rd=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const isR=e=>e.type==='react';
const L0='0.5; 1.2; 0.3';
const newStep=(c='#e53935',txt='')=>({color:c,text:txt,tcolor:'#ffffff',mode:'fixed',a:0.8,b:1.5,list:L0,rnd:false,tapNext:true});

function norm(e){
  e.type=e.type||(e.react?'react':'show');
  delete e.react;
  if(!Array.isArray(e.steps))e.steps=[];
  e.steps.forEach(s=>{
    if(s.tapNext===undefined)s.tapNext=e.tapNext!==undefined?!!e.tapNext:true;
  });
  delete e.tapNext;
  if(isR(e)){
    e.shuffle=false;
    if(e.steps.length<2){
      if(!e.steps[0])e.steps[0]=newStep('#e53935','ESPERA');
      e.steps[1]=newStep('#43a047','JÁ!');
      e.steps[1].mode='range';e.steps[1].a=1;e.steps[1].b=2;
    }else if(e.steps.length>2){
      e.steps=e.steps.slice(0,2);
    }
  }
  return e;
}

let db=rd()||[
 {id:uid(),type:'show',name:'Exemplo: 4 cores',rep:6,cd:3,shuffle:true,steps:[
  {color:'#e53935',text:'VERMELHO',tcolor:'#ffffff',mode:'range',a:0.4,b:1.5,list:L0,rnd:false,tapNext:true},
  {color:'#1e88e5',text:'AZUL',tcolor:'#ffffff',mode:'range',a:0.4,b:1.5,list:L0,rnd:false,tapNext:true},
  {color:'#43a047',text:'VERDE',tcolor:'#ffffff',mode:'fixed',a:0.8,b:1.5,list:L0,rnd:false,tapNext:true},
  {color:'#fdd835',text:'AMARELO',tcolor:'#000000',mode:'ramp',a:1.2,b:0.3,list:L0,rnd:false,tapNext:true}]},
 {id:uid(),type:'react',name:'Exemplo: reação',rep:5,cd:3,shuffle:false,steps:[
  {color:'#e53935',text:'ESPERA',tcolor:'#ffffff',mode:'range',a:1,b:3,list:L0,rnd:false,tapNext:false},
  {color:'#43a047',text:'JÁ!',tcolor:'#ffffff',mode:'fixed',a:2,b:2,list:L0,rnd:false,tapNext:true}]}
];
db.forEach(norm);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let cur=null,from='home',run=null,lockObj=null,tab='show',sel=null;
function view(v){['home','edit','prep'].forEach(x=>$('#'+x).hidden=x!==v)}

/* ---------- Início ---------- */
function home(){
  view('home');
  $('#tabs').innerHTML=[['show','Cores'],['react','Reação']].map(([k,v])=>`<button class="${tab===k?'on':''}" data-a="tab" data-t="${k}">${v}</button>`).join('');
  $('#desc').textContent=tab==='react'?'1.ª cor de espera (não clicável) e 2.ª cor de reação (clicável).':'Só mostra as cores a mudar, sem medir toques.';
  const L=db.filter(e=>e.type===tab);
  $('#list').innerHTML=L.map(e=>{
    const sub=isR(e)
      ?`${e.rep}×${e.last?' · média '+e.last.avg+' ms':''}`
      :e.shuffle
        ?`${e.steps.length} cores · ${e.rep} sorteadas`
        :`${e.steps.length} passos · ${e.rep}×`;
    return `<div class="ex"><button class="open" data-a="open" data-id="${e.id}"><span>${esc(e.name||'Sem nome')}</span>
      <small>${sub}</small></button>
      <button class="ed" data-a="edit" data-id="${e.id}">Editar</button></div>`;
  }).join('')||'<p class="muted">Ainda não tens exercícios aqui. Cria o primeiro.</p>';
}

/* ---------- Página antes do exercício ---------- */
function prep(id){
  sel=id||sel;const e=db.find(x=>x.id===sel);
  if(!e){home();return}
  view('prep');
  const r=isR(e);
  const rows=[['Tipo',r?'Reação':'Cores']];
  if(r){
    rows.push(['Repetições',e.rep],['Contagem inicial',(e.cd|0)+' s']);
    if(e.last)rows.push(['Última média',e.last.avg+' ms']);
  }else{
    rows.push(['Cores criadas',e.steps.length]);
    rows.push([e.shuffle?'Cores a mostrar':'Repetições',e.rep]);
    rows.push(['Contagem inicial',(e.cd|0)+' s']);
    rows.push(['Ordem aleatória',e.shuffle?'Sim':'Não']);
  }
  $('#prep').innerHTML=`<h1 style="text-align:center">${esc(e.name||'Sem nome')}</h1>
  <div class="sum">${rows.map(([k,v])=>`<div><span class="muted">${k}</span><b>${v}</b></div>`).join('')}</div>
  <div class="prepbar"><button class="pri go" data-a="go">Começar</button><button class="back" data-a="back">Voltar</button></div>`;
}

/* ---------- Editor ---------- */
const MODES={fixed:'Fixo',range:'Intervalo aleatório',list:'Lista de valores',ramp:'Progressivo'};
function timingHtml(s,i){
  const n=(k,l)=>`<div><label>${l}</label><input type="number" inputmode="decimal" min="0.05" step="any" data-i="${i}" data-k="${k}" value="${s[k]}"></div>`;
  if(s.mode==='fixed')return `<div class="row">${n('a','Tempo (s)')}</div>`;
  if(s.mode==='range')return `<div class="row">${n('a','Mínimo (s)')}${n('b','Máximo (s)')}</div>`;
  if(s.mode==='ramp')return `<div class="row">${n('a','Início (s)')}${n('b','Fim (s)')}</div><div class="muted">Vai mudando ao longo do exercício.</div>`;
  return `<label>Valores em segundos, separados por ponto e vírgula</label><input data-i="${i}" data-k="list" value="${esc(s.list)}">
    <label class="chk"><input type="checkbox" data-i="${i}" data-k="rnd" ${s.rnd?'checked':''}> Escolher ao acaso</label>`;
}
function stepHtml(s,i){
  const r=isR(cur);
  const tag=r?(i===0?'1.ª Cor — Espera (não clicável)':'2.ª Cor — Ação (clicável)'):'';
  const tools=r?'':`<div class="tools"><button data-a="up" data-i="${i}">↑</button><button data-a="down" data-i="${i}">↓</button>
    <button data-a="dup" data-i="${i}">⧉</button><button class="bad" data-a="del" data-i="${i}">✕</button></div>`;
  const timeLabel=r?(i===0?'Tempo de espera antes de mudar':'Tempo máximo para tocar'):'Tempo até à cor seguinte';
  return `<div class="step" style="border-left-color:${s.color}">
  ${tag?`<div class="step-tag">${tag}</div>`:''}
  <div class="row"><input type="color" data-i="${i}" data-k="color" value="${s.color}" aria-label="Cor de fundo">
  <input type="color" data-i="${i}" data-k="tcolor" value="${s.tcolor}" aria-label="Cor do texto">${tools}</div>
  <label>Texto (Enter = nova linha; encolhe para caber)</label>
  <textarea rows="2" data-i="${i}" data-k="text">${esc(s.text)}</textarea>
  <label>${timeLabel}</label>
  <select data-i="${i}" data-k="mode">${Object.entries(MODES).map(([k,v])=>`<option value="${k}" ${s.mode===k?'selected':''}>${v}</option>`).join('')}</select>
  ${timingHtml(s,i)}
  ${r&&i===1?`<label class="chk"><input type="checkbox" data-i="${i}" data-k="tapNext" ${s.tapNext!==false?'checked':''}> Ao tocar, passa logo para a próxima repetição</label>`:''}
  </div>`;
}
function editor(){
  view('edit');
  const r=isR(cur);
  const repLabel=!r&&cur.shuffle?'Número de cores':'Repetições';
  $('#edit').innerHTML=`<h1>${r?'Exercício de reação':'Exercício de cores'}</h1>
  <p class="muted">${r?'Define a 1.ª cor de espera (não clicável) e a 2.ª cor onde deves tocar.':'Só mostra as cores, sem medir toques.'}</p>
  <label>Nome</label><input data-k="name" value="${esc(cur.name)}">
  <div class="row"><div><label id="rep-lbl">${repLabel}</label><input type="number" inputmode="numeric" min="1" data-k="rep" value="${cur.rep}"></div>
  <div><label>Contagem inicial (s)</label><input type="number" inputmode="numeric" min="0" data-k="cd" value="${cur.cd}"></div></div>
  ${!r?`<label class="chk"><input type="checkbox" data-k="shuffle" ${cur.shuffle?'checked':''}> Ordem aleatória das cores</label>`:''}
  ${cur.steps.map(stepHtml).join('')}
  ${!r?`<button data-a="add" style="width:100%">+ Adicionar passo</button>`:''}
  <div class="bar"><button class="pri" data-a="save">Guardar</button><button data-a="test">▶ Testar</button>
  <button data-a="cancel">Voltar</button><button class="bad" data-a="delex">Apagar</button></div>`;
}
$('#edit').addEventListener('input',e=>{
  const t=e.target,k=t.dataset.k;if(!k)return;
  const o=t.dataset.i!==undefined?cur.steps[+t.dataset.i]:cur;
  o[k]=t.type==='checkbox'?t.checked:t.type==='number'?+t.value:t.value;
  if(k==='color')t.closest('.step').style.borderLeftColor=t.value;
  if(k==='shuffle'){
    const lbl=$('#rep-lbl');
    if(lbl)lbl.textContent=cur.shuffle?'Número de cores':'Repetições';
  }
});
$('#edit').addEventListener('change',e=>{if(e.target.dataset.k==='mode')editor()});

/* ---------- Ações ---------- */
function handleAction(a,b){
  const i=+b.dataset.i,id=b.dataset.id,S=cur&&cur.steps;
  if(a==='tab'){tab=b.dataset.t;home()}
  else if(a==='open'){prep(id)}
  else if(a==='go'){start(db.find(x=>x.id===sel),'prep')}
  else if(a==='back'){home()}
  else if(a==='new'){
    const steps=tab==='react'
      ?[
        {color:'#e53935',text:'ESPERA',tcolor:'#ffffff',mode:'range',a:1,b:3,list:L0,rnd:false,tapNext:false},
        {color:'#43a047',text:'JÁ!',tcolor:'#ffffff',mode:'fixed',a:2,b:2,list:L0,rnd:false,tapNext:true}
      ]
      :[newStep()];
    cur={id:uid(),type:tab,name:'',rep:5,cd:3,shuffle:false,steps};
    editor();
  }
  else if(a==='edit'){cur=norm(JSON.parse(JSON.stringify(db.find(x=>x.id===id))));editor()}
  else if(a==='add'){S.push(newStep());editor()}
  else if(a==='del'){if(S.length>1){S.splice(i,1);editor()}}
  else if(a==='dup'){S.splice(i+1,0,JSON.parse(JSON.stringify(S[i])));editor()}
  else if(a==='up'&&i>0){[S[i-1],S[i]]=[S[i],S[i-1]];editor()}
  else if(a==='down'&&i<S.length-1){[S[i+1],S[i]]=[S[i],S[i+1]];editor()}
  else if(a==='save'){persist();home()}
  else if(a==='test'){start(cur,'edit')}
  else if(a==='cancel'){home()}
  else if(a==='delex'){if(confirm('Apagar este exercício?')){db=db.filter(x=>x.id!==cur.id);save();home()}}
  else if(a==='exp'){const j=JSON.stringify(db);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert('Backup copiado. Cola-o numa nota.')).catch(()=>prompt('Copia o backup:',j))}
  else if(a==='imp'){const j=prompt('Cola aqui o backup:');if(j){try{const d=JSON.parse(j);if(!Array.isArray(d))throw 0;d.forEach(x=>{x.id=uid();db.push(norm(x))});save();home()}catch(_){alert('Backup inválido.')}}}
  else if(a==='again'){
    const origin=from;
    stop(true);
    origin==='edit'&&cur?editor():prep();
  }
  else if(a==='close'){
    stop(true);
    home();
  }
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b)handleAction(b.dataset.a,b);
});

$('#res').addEventListener('pointerup',e=>{
  const b=e.target.closest('[data-a]');
  if(!b)return;
  e.preventDefault();
  e.stopPropagation();
  handleAction(b.dataset.a,b);
});

function persist(){
  cur.name=cur.name||'Sem nome';cur.rep=Math.max(1,cur.rep|0);
  const k=db.findIndex(x=>x.id===cur.id);
  const keep=k>=0?db[k].last:undefined;if(keep)cur.last=keep;
  k>=0?db[k]=cur:db.push(cur);save();
}

/* ---------- Execução ---------- */
function delay(s,n,total){
  const a=+s.a||0,b=+s.b||0;let ms;
  if(s.mode==='range'){const lo=Math.min(a,b),hi=Math.max(a,b);ms=lo+Math.random()*(hi-lo)}
  else if(s.mode==='list'){const L=String(s.list).split(/[;\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0);
    ms=!L.length?0.8:s.rnd?L[Math.random()*L.length|0]:L[n%L.length]}
  else if(s.mode==='ramp')ms=a+(b-a)*(total>1?n/(total-1):0);
  else ms=a;
  return Math.max(16,ms*1000);
}
function build(ex){
  const count=Math.max(1,ex.rep|0);
  if(isR(ex)){
    const seq=[];
    for(let r=0;r<count;r++){
      seq.push({...ex.steps[0],_role:'wait'});
      seq.push({...ex.steps[1],_role:'go'});
    }
    return seq;
  }
  if(ex.shuffle){
    const seq=[];
    for(let r=0;r<count;r++){
      const pick=ex.steps[Math.random()*ex.steps.length|0];
      seq.push({...pick});
    }
    return seq;
  }
  const seq=[];
  for(let r=0;r<count;r++){
    seq.push(...ex.steps.map(s=>({...s})));
  }
  return seq;
}
function fit(){
  const t=$('#txt'),box=$('#box'),W=box.clientWidth,H=box.clientHeight;
  if(!t.textContent){return}
  let lo=6,hi=Math.max(H,200);
  for(let k=0;k<14;k++){
    const m=(lo+hi)/2;t.style.fontSize=m+'px';
    if(t.offsetWidth<=W&&t.offsetHeight<=H)lo=m;else hi=m;
  }
  t.style.fontSize=lo+'px';
}
function paint(bg,text,fg){$('#run').style.background=bg;const t=$('#txt');t.textContent=text;t.style.color=fg;fit()}
async function lock(){try{lockObj=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{lockObj&&lockObj.release()}catch(e){}lockObj=null}
document.addEventListener('visibilitychange',()=>{if(run&&document.visibilityState==='visible')lock()});

function start(ex,origin){
  stop(true);from=origin;
  run={ex,seq:build(ex),i:-1,times:[],miss:0,next:0,t0:0,tapped:true,blinking:false,raf:0,cd:0};
  $('#res').hidden=true;$('#run').hidden=false;lock();
  let c=Math.max(0,ex.cd|0);
  const step=()=>{
    if(!run)return;
    if(c>0){paint('#000',String(c),'#fff');c--;run.cd=setTimeout(step,1000)}
    else{run.raf=requestAnimationFrame(tick);advance()}
  };
  step();
}
function tick(now){
  if(!run)return;
  if(run.next&&now>=run.next){
    if(run.blinking){
      run.blinking=false;
      showStep();
    }else{
      advance();
    }
  }
  if(run)run.raf=requestAnimationFrame(tick);
}
function advance(){
  const r=run;
  if(isR(r.ex)&&r.i>=0){
    const prev=r.seq[r.i];
    if(prev&&prev._role==='go'&&!r.tapped)r.miss++;
  }
  r.i++;
  if(r.i>=r.seq.length){finish();return}

  if(!isR(r.ex)&&r.i>0){
    r.blinking=true;
    r.next=0;
    paint(BLINK_BG,'','#fff');
    requestAnimationFrame(()=>{
      if(run!==r)return;
      r.next=performance.now()+200;
    });
    return;
  }
  showStep();
}
function showStep(){
  const r=run;
  const s=r.seq[r.i];
  paint(s.color,s.text,s.tcolor);
  r.next=0;r.tapped=false;
  requestAnimationFrame(()=>{
    if(run!==r)return;
    r.t0=performance.now();
    r.next=r.t0+delay(s,r.i,r.seq.length);
  });
}
$('#run').addEventListener('pointerdown',e=>{
  if(!run||!$('#res').hidden||!isR(run.ex)||!run.next||e.target.closest('button'))return;
  const s=run.seq[run.i];
  if(!s)return;
  if(s._role==='wait'){
    if(!run.tapped){
      run.tapped=true;
      run.miss++;
    }
    return;
  }
  if(s._role==='go'&&!run.tapped){
    run.tapped=true;
    run.times.push(Math.max(0,e.timeStamp-run.t0));
    if(s.tapNext!==false)advance();
  }
});
function finish(){
  cancelAnimationFrame(run.raf);unlock();
  $('#run').hidden=true;
  const r=isR(run.ex),t=run.times,n=t.length;
  const avg=n?Math.round(t.reduce((a,b)=>a+b,0)/n):0;
  const best=n?Math.round(Math.min(...t)):0,worst=n?Math.round(Math.max(...t)):0;
  const ex=db.find(x=>x.id===run.ex.id);
  if(r&&n&&ex){ex.last={avg,best,worst,d:Date.now()};save()}
  $('#res').hidden=false;
  $('#res').innerHTML=`<div class="inner">`+(r?'<h1>Resultado</h1>':'<h1>Terminado</h1>')+(!r?'':n?
    `<div class="muted">Média</div><div class="big">${avg} ms</div>
     <p>Melhor ${best} ms · Pior ${worst} ms<br>Toques válidos: ${n} · Falhas / antecipados: ${run.miss}</p>`
    :`<p class="muted">Não houve toques válidos registados. Aguarda pela 2.ª cor para tocar.</p>`)+
    `<div class="bar"><button type="button" class="pri" data-a="again">Repetir</button><button type="button" data-a="close">Fechar</button></div></div>`;
}
function stop(silent){
  if(run){cancelAnimationFrame(run.raf);clearTimeout(run.cd)}
  const had=run;run=null;unlock();
  $('#run').hidden=true;$('#res').hidden=true;
  if(!silent&&had){from==='edit'&&cur?editor():from==='prep'?prep():home()}
}
$('#x').addEventListener('click',()=>stop());
addEventListener('resize',()=>{if(run&&!$('#run').hidden)fit()});
home();

</script>
</body>
